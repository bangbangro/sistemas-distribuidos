services:
  redis:
    image: redis:latest
    container_name: redis_cache
    command: ["redis-server", "--maxmemory", "2mb", "--maxmemory-policy", "allkeys-lfu"]
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 100M

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CREATE_TOPICS: "consultas:3:1,consultas_retry:3:1,consultas_dlq:1:1,metrics-topic:3:1"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/kafka/9092"]
      interval: 5s
      timeout: 2s
      retries: 12

  traffic-generator:
    build: ./traffic-generator
    container_name: traffic_generator
    depends_on:
      - redis
      - kafka

  consumer:
    build: ./response-generator
    command: python consumer.py
    depends_on:
      - kafka
      - redis
    volumes:
      - ./data:/data
    deploy:
      replicas: 3

  metrics:
    build: ./metrics
    container_name: metrics_monitor
    depends_on:
      - kafka
      - elasticsearch
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      METRICS_TOPIC: metrics-topic
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
    command: ["python", "main.py"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - es_data:/usr/share/elasticsearch/data

  es-init:
    image: curlimages/curl:latest
    container_name: es_init
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      sh -c "
        echo 'Creating Elasticsearch index templates...' &&
        curl -s -X PUT 'http://elasticsearch:9200/_index_template/metrics-template' \
          -H 'Content-Type: application/json' \
          -d '{
            \"index_patterns\": [\"system-metrics*\", \"metrics-aggregated*\"],
            \"template\": {
              \"mappings\": {
                \"properties\": {
                  \"@timestamp\":            { \"type\": \"date\" },
                  \"elapsed_seconds\":       { \"type\": \"integer\" },
                  \"hits\":                  { \"type\": \"integer\" },
                  \"misses\":                { \"type\": \"integer\" },
                  \"total\":                 { \"type\": \"integer\" },
                  \"hit_rate\":              { \"type\": \"float\" },
                  \"latency_p50_ms\":        { \"type\": \"float\" },
                  \"latency_p95_ms\":        { \"type\": \"float\" },
                  \"throughput_overall_qps\": { \"type\": \"float\" },
                  \"throughput_window_qps\": { \"type\": \"float\" },
                  \"retries_total\":         { \"type\": \"integer\" },
                  \"retry_rate\":            { \"type\": \"float\" },
                  \"recovered_total\":       { \"type\": \"integer\" },
                  \"recovery_rate\":         { \"type\": \"float\" },
                  \"recovery_time_sec\":     { \"type\": \"float\" },
                  \"dlq_total\":             { \"type\": \"integer\" },
                  \"dlq_rate\":              { \"type\": \"float\" },
                  \"backlog_redis\":         { \"type\": \"integer\" },
                  \"evictions_redis\":       { \"type\": \"integer\" },
                  \"window_start\":          { \"type\": \"date\" },
                  \"window_end\":            { \"type\": \"date\" },
                  \"throughput\":            { \"type\": \"integer\" },
                  \"total_queries\":         { \"type\": \"integer\" },
                  \"latency_p50\":           { \"type\": \"float\" },
                  \"latency_p95\":           { \"type\": \"float\" },
                  \"avg_latency\":           { \"type\": \"float\" },
                  \"dlq_count\":             { \"type\": \"integer\" },
                  \"recovery_rate\":         { \"type\": \"float\" }
                }
              }
            }
          }' &&
        echo 'Index template created successfully.'
      "

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

  spark:
    build: ./spark
    container_name: spark_streaming
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      METRICS_TOPIC: metrics-topic
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
    command: ["python", "/spark/spark_streaming.py"]
    volumes:
      - ./spark:/spark

volumes:
  es_data:  