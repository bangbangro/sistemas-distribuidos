version: '3.8'
services:
  redis:
    image: redis:latest
    container_name: redis_cache
    command: ["redis-server", "--maxmemory", "2mb", "--maxmemory-policy", "allkeys-lfu"]
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 100M

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CREATE_TOPICS: "consultas:1:1,consultas_retry:1:1,consultas_dlq:1:1"

  response-generator:
    build: ./response-generator
    container_name: response_generator
    depends_on:
      - redis
    volumes:
      - ./data:/data

  traffic-generator:
    build: ./traffic-generator
    container_name: traffic_generator
    depends_on:
      - redis
      - kafka

  metrics:
    build: ./metrics
    container_name: metrics_monitor
    depends_on:
      - redis

  consumer:
    build: ./response-generator
    command: python consumer.py
    depends_on:
      - kafka
      - redis
    deploy:
      replicas: 3
